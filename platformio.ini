[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 1
monitor_dtr = 1
; --- Serial upload (first flash) ---
; Auto-reset via DTR/RTS (CP210x). If your board lacks the
; auto-reset circuit you must hold BOOT once for the very first
; upload. After that, use OTA and never touch the board again.
upload_port = COM8
upload_speed = 460800
; --- OTA upload (all subsequent flashes, no cable / no button) ---
; After the first flash + WiFi setup, find the IP from serial logs
; or http://esp32-agent.local and run:
;   pio run --target upload --upload-port <ESP_IP>
; ArduinoOTA must be enabled in firmware (it is by default).
upload_protocol = esptool
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DCORE_DEBUG_LEVEL=0
board_build.partitions = default.csv
board_build.filesystem = littlefs

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.5.44
upload_flags =
  --port=3232
